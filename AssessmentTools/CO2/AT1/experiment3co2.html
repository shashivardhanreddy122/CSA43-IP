<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment 3 - CSS Layout Debugging</title>

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Body */
body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

/* Header */
header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

/* Navigation */
nav{
    background:#34495e;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

nav a:hover{
    background:#2c3e50;
}

/* Main Container */
.container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    padding:20px;
}

/* Boxes */
.box{
    flex:1 1 250px;
    background:white;
    padding:40px;
    text-align:center;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

/* Footer */
footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

/* Tablet View */
@media(max-width:768px){

.container{
    flex-direction:column;
}

.box{
    width:100%;
}

}

/* Mobile View */
@media(max-width:480px){

nav{
    flex-direction:column;
}

nav a{
    text-align:center;
    border-bottom:1px solid white;
}

header h1{
    font-size:22px;
}

.box{
    padding:25px;
    font-size:18px;
}

}

</style>

</head>
<body>

<header>
<h1>CSS Layout Debugging</h1>
</header>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>

<div class="container">

<div class="box">
<h2>Box 1</h2>
<p>Responsive layout using Flexbox.</p>
</div>

<div class="box">
<h2>Box 2</h2>
<p>Proper spacing and alignment.</p>
</div>

<div class="box">
<h2>Box 3</h2>
<p>No overlapping of elements.</p>
</div>

<div class="box">
<h2>Box 4</h2>
<p>Works on desktop, tablet, and mobile.</p>
</div>

</div>

<footer>
<p>© 2026 CSS Layout Debugging Experiment</p>
</footer>

</body>
</html>
